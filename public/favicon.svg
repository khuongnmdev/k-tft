<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3987e5"/>
      <stop offset="50%" stop-color="#7952b3"/>
      <stop offset="100%" stop-color="#e9b949"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3987e5" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Dark Hexagon Background -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#1a1a19" stroke="url(#grad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Internal Tactical Diamond / TFT Crest -->
  <polygon points="32,14 46,32 32,50 18,32" fill="none" stroke="#e9b949" stroke-width="2" stroke-dasharray="2,2"/>
  <!-- Central 'k' Crest with Rank Star -->
  <path d="M26,20 L26,44 M26,33 L38,20 M30,30 L39,44" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top Star Accent -->
  <polygon points="32,10 33.5,13.5 37,13.5 34,15.5 35.5,19 32,17 28.5,19 30,15.5 27,13.5 30.5,13.5" fill="#e9b949"/>
</svg>
